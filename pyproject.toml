[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-tds"
version = "0.1.0"
description = "Quantum Unified Statistical Attack-Hypothesis Attribution & Response for Teleportation-Based QDS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pycryptodome>=3.18.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "pytest>=7.3.0"
]
